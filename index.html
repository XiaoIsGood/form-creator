<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormCreator Demo</title>
<style>
body { max-width: 720px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; }
h1 { margin-bottom: 24px; }
.form-creator { max-width: 400px; }
</style>
</head>
<body>
<h1>FormCreator Demo</h1>
<div id="form" class="form-creator"></div>

<pre id="output" style="margin-top:24px;padding:16px;background:#f5f5f5;border-radius:6px;font-size:13px;"></pre>

<script src="form-creator.js"></script>
<script>
// Schema definitions
const schema = [
  { type: 'text', name: 'username', label: '用户名', placeholder: '请输入用户名', maxlength: 20, defaultValue: '',
    rules: [{ required: true, message: '用户名不能为空' }, { min: 3, message: '至少3个字符' }, { max: 20, message: '最多20个字符' }] },
  { type: 'password', name: 'password', label: '密码', placeholder: '请输入密码',
    rules: [{ required: true, message: '密码不能为空' }, { min: 6, message: '至少6个字符' }] },
  { type: 'number', name: 'age', label: '年龄', min: 1, max: 150, defaultValue: 18 },
  { type: 'textarea', name: 'bio', label: '个人简介', rows: 4, maxlength: 200, placeholder: '说说你自己...' },
  { type: 'switch', name: 'agree', label: '同意用户协议', defaultValue: false,
    rules: [{ custom: v => v === true, message: '请同意用户协议' }] },
  { type: 'select', name: 'city', label: '城市', options: ['北京', '上海', '广州', '深圳'], defaultValue: '北京' },
  { type: 'radio', name: 'gender', label: '性别', options: [{ value: 'male', label: '男' }, { value: 'female', label: '女' }], defaultValue: 'male' },
  { type: 'checkbox', name: 'hobbies', label: '兴趣爱好', options: ['读书', '运动', '音乐', '旅行'], defaultValue: ['读书', '音乐'] },
  { type: 'date', name: 'birthday', label: '生日' },
  { type: 'time', name: 'alarm', label: '提醒时间' },
  { type: 'color', name: 'favColor', label: '喜欢的颜色', defaultValue: '#4a90d9' },
  { type: 'slider', name: 'volume', label: '音量', min: 0, max: 100, step: 5, defaultValue: 50 },
  { type: 'file', name: 'avatar', label: '上传头像', accept: '.jpg,.png,.gif' },
];

const form = new FormCreator({
  container: '#form',
  schema: schema,
  validators: {
    notAdmin: v => v !== 'admin',
  },
});

// Display values on change
const $output = document.getElementById('output');
const update = () => {
  $output.textContent = JSON.stringify(form.getValues(), null, 2);
};
form.onChange(update);
update();
</script>
</body>
</html>
